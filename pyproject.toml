[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["dist", "build", ".venv", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
files = ["iram_tap"]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["iram_tap.models", "iram_tap.text_mode", "iram_tap.ui.settings_model", "iram_tap.config.*"]
disallow_untyped_defs = true
